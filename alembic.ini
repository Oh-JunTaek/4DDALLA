# Alembic configuration for 4 DDALLA (P1-DB-02).
#
# The connection is NOT configured here: alembic/env.py reads DATABASE_URL from
# the environment (same source as the application DB layer). The value of this
# file's placeholder is intentionally unused - alembic/env.py overrides it.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url = postgresql+psycopg://4ddalla:CHANGE_ME@127.0.0.1:5432/4ddalla
version_locations = alembic/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
